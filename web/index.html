<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    >

    <title>WALAWWA - Download</title>


    <!-- =====================================================
         WALAWWA STYLE
         ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css?v=47"
    >


    <!-- =====================================================
         MOBILE POSITION OVERRIDE
         ===================================================== -->

    <style>

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 520px) {

            html,
            body {
                width: 100% !important;

                min-height: 100% !important;

                margin: 0 !important;

                padding: 0 !important;

                overflow-x: hidden !important;
            }


            /* =================================================
               MAIN PAGE
               ================================================= */

            .download-page {
                position: relative !important;

                width: 100% !important;

                min-height: 1500px !important;

                height: 1500px !important;

                display: block !important;

                margin: 0 !important;

                padding: 0 !important;

                overflow-x: hidden !important;
            }


            /* =================================================
               WALAWWA CARD
               
               THIS IS THE ONLY ELEMENT BEING MOVED.
               ================================================= */

            .download-card {
                position: absolute !important;

                top: 650px !important;

                left: 50% !important;

                right: auto !important;

                bottom: auto !important;

                width: calc(100% - 24px) !important;

                max-width: 360px !important;

                margin: 0 !important;

                padding: 17px 12px 14px !important;

                transform: translateX(-50%) !important;

                z-index: 50 !important;
            }


            /* =================================================
               POWERED BY MACO
               
               THIS POSITION IS INDEPENDENT.
               IT DOES NOT MOVE WITH THE CARD.
               ================================================= */

            .download-footer {
                position: absolute !important;

                top: 900px !important;

                left: 50% !important;

                right: auto !important;

                bottom: auto !important;

                width: calc(100% - 24px) !important;

                max-width: 360px !important;

                margin: 0 !important;

                padding: 0 5px !important;

                transform: translateX(-50%) !important;

                z-index: 20 !important;
            }

        }


        /* =====================================================
           SMALL PHONES
           ===================================================== */

        @media (max-width: 380px) {

            .download-card {
                top: 650px !important;

                width: calc(100% - 20px) !important;

                max-width: 330px !important;
            }


            .download-footer {
                top: 900px !important;

                width: calc(100% - 20px) !important;

                max-width: 330px !important;
            }

        }


        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media (max-width: 340px) {

            .download-card {
                top: 650px !important;

                width: calc(100% - 18px) !important;

                max-width: 305px !important;
            }


            .download-footer {
                top: 900px !important;

                width: calc(100% - 18px) !important;

                max-width: 305px !important;
            }

        }


        /* =====================================================
           LANDSCAPE PHONE
           ===================================================== */

        @media (max-height: 520px) and (max-width: 900px) {

            .download-page {
                min-height: 1100px !important;

                height: 1100px !important;
            }


            .download-card {
                top: 650px !important;

                max-width: 350px !important;
            }


            .download-footer {
                top: 900px !important;

                max-width: 350px !important;
            }

        }

    </style>


    <!-- =====================================================
         MONETAG
         ===================================================== -->

    <script
        src="https://quge5.com/88/tag.min.js"
        data-zone="266058"
        async
        data-cfasync="false">
    </script>

</head>


<body>


    <!-- =====================================================
         ANIMATED BACKGROUND
         ===================================================== -->

    <div
        class="animated-background"
        aria-hidden="true"
    >

        <!-- PURPLE ORBS -->

        <div class="gradient-orb orb-1"></div>

        <div class="gradient-orb orb-2"></div>

        <div class="gradient-orb orb-3"></div>


        <!-- FLOATING PARTICLES -->

        <div class="particle particle-1"></div>

        <div class="particle particle-2"></div>

        <div class="particle particle-3"></div>

        <div class="particle particle-4"></div>

        <div class="particle particle-5"></div>

        <div class="particle particle-6"></div>

    </div>



    <!-- =====================================================
         MAIN DOWNLOAD PAGE
         ===================================================== -->

    <main class="download-page">


        <!-- =================================================
             COMPLETE WALAWWA CARD
             ================================================= -->

        <section
            class="download-card"
            aria-label="Download"
        >


            <!-- =============================================
                 LOGO
                 ============================================= -->

            <div class="logo">
                WALAWWA
            </div>


            <!-- =============================================
                 LOGO LINE
                 ============================================= -->

            <div
                class="logo-line"
                aria-hidden="true"
            ></div>



            <!-- =============================================
                 DOWNLOAD AREA
                 ============================================= -->

            <div id="downloadArea">


                <!-- =========================================
                     FIRST DOWNLOAD BUTTON
                     ========================================= -->

                <button
                    id="firstDownload"
                    class="download-button"
                    type="button"
                >

                    <span
                        class="download-icon"
                        aria-hidden="true"
                    >↓</span>


                    <span class="button-text">
                        Continue Download
                    </span>

                </button>



                <!-- =========================================
                     COUNTDOWN
                     ========================================= -->

                <div
                    id="countdown"
                    class="countdown"
                    style="display: none;"
                    aria-live="polite"
                >

                    <div class="countdown-label">
                        PREPARING DOWNLOAD
                    </div>


                    <div
                        id="countdownNumber"
                        class="countdown-number"
                    >
                        5
                    </div>


                    <div class="countdown-small">
                        Please wait...
                    </div>

                </div>



                <!-- =========================================
                     SECOND DOWNLOAD BUTTON
                     ========================================= -->

                <button
                    id="secondDownload"
                    class="download-button continue-button"
                    type="button"
                    style="display: none;"
                >

                    <span
                        class="download-icon"
                        aria-hidden="true"
                    >↓</span>


                    <span class="button-text">
                        Download
                    </span>

                </button>



                <!-- =========================================
                     MESSAGE
                     ========================================= -->

                <div
                    id="message"
                    class="message"
                    aria-live="polite"
                ></div>


            </div>



            <!-- =============================================
                 SINHALA DESCRIPTION
                 ============================================= -->

            <div class="sinhala-description">

                කරුණාකර ඉහළ ඇති
                <strong>Continue Download</strong>
                බොත්තම ඔබන්න.

                <br>

                තත්පර කිහිපයකින්
                <strong>Download</strong>
                බොත්තම දිස්වනු ඇත.

            </div>


        </section>



        <!-- =================================================
             FOOTER
             ================================================= -->

        <footer class="download-footer">

            Powered by
            <strong>Maco</strong>

        </footer>


    </main>



    <!-- =====================================================
         WALAWWA JAVASCRIPT
         ===================================================== -->

    <script
        src="script.js?v=47"
    ></script>


</body>

</html>
