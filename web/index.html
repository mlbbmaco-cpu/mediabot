<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    >

    <title>WALAWWA - Download</title>

    <!-- =====================================================
         CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="style.css?v=42"
    >


    <!-- =====================================================
         MONETAG
         ===================================================== -->

    <script
        src="https://quge5.com/88/tag.min.js"
        data-zone="266058"
        async
        data-cfasync="false">
    </script>

</head>


<body>

    <!-- =====================================================
         ANIMATED BACKGROUND
         ===================================================== -->

    <div
        class="animated-background"
        aria-hidden="true"
    >

        <!-- PURPLE MOVING ORBS -->

        <div class="gradient-orb orb-1"></div>

        <div class="gradient-orb orb-2"></div>

        <div class="gradient-orb orb-3"></div>


        <!-- FLOATING PARTICLES -->

        <div class="particle particle-1"></div>

        <div class="particle particle-2"></div>

        <div class="particle particle-3"></div>

        <div class="particle particle-4"></div>

        <div class="particle particle-5"></div>

        <div class="particle particle-6"></div>

    </div>



    <!-- =====================================================
         MAIN DOWNLOAD PAGE
         ===================================================== -->

    <main class="download-page">


        <!-- =================================================
             DOWNLOAD CARD
             ================================================= -->

        <section
            class="download-card"
            aria-label="Download"
        >


            <!-- =================================================
                 LOGO
                 ================================================= -->

            <div class="logo">
                WALAWWA
            </div>


            <div
                class="logo-line"
                aria-hidden="true"
            ></div>



            <!-- =================================================
                 DOWNLOAD AREA
                 ================================================= -->

            <div id="downloadArea">


                <!-- =================================================
                     FIRST BUTTON
                     ================================================= -->

                <button
                    id="firstDownload"
                    class="download-button"
                    type="button"
                >

                    <span
                        class="download-icon"
                        aria-hidden="true"
                    >↓</span>

                    <span class="button-text">
                        Continue Download
                    </span>

                </button>



                <!-- =================================================
                     COUNTDOWN
                     ================================================= -->

                <div
                    id="countdown"
                    class="countdown"
                    style="display: none;"
                    aria-live="polite"
                >

                    <div class="countdown-label">
                        PREPARING DOWNLOAD
                    </div>


                    <div
                        id="countdownNumber"
                        class="countdown-number"
                    >
                        5
                    </div>


                    <div class="countdown-small">
                        Please wait...
                    </div>

                </div>



                <!-- =================================================
                     SECOND DOWNLOAD BUTTON
                     ================================================= -->

                <button
                    id="secondDownload"
                    class="download-button continue-button"
                    type="button"
                    style="display: none;"
                >

                    <span
                        class="download-icon"
                        aria-hidden="true"
                    >↓</span>

                    <span class="button-text">
                        Download
                    </span>

                </button>



                <!-- =================================================
                     MESSAGE
                     ================================================= -->

                <div
                    id="message"
                    class="message"
                    aria-live="polite"
                ></div>


            </div>



            <!-- =================================================
                 SINHALA DESCRIPTION
                 ================================================= -->

            <div class="sinhala-description">

                කරුණාකර ඉහළ ඇති
                <strong>Continue Download</strong>
                බොත්තම ඔබන්න.

                <br>

                තත්පර කිහිපයකින්
                <strong>Download</strong>
                බොත්තම දිස්වනු ඇත.

            </div>


        </section>



        <!-- =================================================
             FOOTER
             ================================================= -->

        <footer class="download-footer">

            Powered by
            <strong>Maco</strong>

        </footer>


    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="script.js?v=42"
    ></script>


</body>

</html>
