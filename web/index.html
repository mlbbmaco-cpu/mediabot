<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WALAWWA - Download</title>

    <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>WALAWWA</h1>

            <p class="subtitle">
                Your file is ready.<br>
                Click the button below to continue.
            </p>

            <div id="downloadArea">

                <button
                    id="firstDownload"
                    class="download-button"
                    type="button"
                >
                    ⬇️ Download
                </button>

                <div
                    id="countdown"
                    class="countdown"
                    style="display:none;"
                >
                    Please wait
                    <span id="countdownNumber">5</span>
                    seconds...
                </div>

                <button
                    id="secondDownload"
                    class="download-button"
                    type="button"
                    style="display:none;"
                >
                    ⬇️ Continue Download
                </button>

                <div
                    id="message"
                    class="message"
                ></div>

            </div>

        </div>

        <footer>
            WALAWWA
            <br>
            <a
                href="https://t.me/walawwa_downloadBot"
                target="_blank"
                rel="noopener noreferrer"
            >
                Telegram Bot
            </a>
        </footer>

    </div>

    <script src="script.js?v=6"></script>

</body>
</html>
