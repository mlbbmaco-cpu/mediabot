<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070b2a"
    >

    <title>WALAWWA</title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <!-- Monetag -->
    <script
        src="https://quge5.com/88/tag.min.js"
        data-zone="266058"
        async
        data-cfasync="false">
    </script>
</head>

<body>

    <main class="page">

        <section class="download-card">

            <div class="brand">
                WALAWWA
            </div>

            <div class="brand-line"></div>

            <div id="status-area">

                <p class="message">
                    Your download is ready
                </p>

                <div
                    id="countdown"
                    class="countdown"
                >
                    5
                </div>

                <p
                    id="countdown-text"
                    class="countdown-text"
                >
                    Please wait...
                </p>

            </div>

            <button
                id="download-button"
                class="download-button"
                type="button"
                disabled
            >
                <span class="download-icon">↓</span>
                <span id="button-text">
                    Preparing...
                </span>
            </button>

            <p
                id="error-message"
                class="error-message"
                hidden
            ></p>

        </section>

        <div class="ad-container">
            <!-- Monetag advertisement area -->
        </div>

    </main>

    <script src="./app.js"></script>

</body>
</html>
