<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#090909"
    >

    <title>Walawwa Download</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="page">

        <div class="card">

            <div class="logo">
                W
            </div>

            <h1>
                WALAWWA
            </h1>

            <p class="subtitle">
                Download Center
            </p>

            <div
                id="loading"
                class="loading"
            >
                <span class="spinner"></span>

                <p>
                    Preparing your download...
                </p>
            </div>

            <div
                id="ready"
                class="content hidden"
            >

                <p>
                    Your file is ready.
                </p>

                <button
                    id="telegramButton"
                    class="telegram-button"
                >
                    🎬 WATCH NOW
                </button>

            </div>

            <div
                id="error"
                class="content hidden"
            >

                <div class="error-icon">
                    ⚠️
                </div>

                <h2>
                    Invalid Link
                </h2>

                <p>
                    This download link is missing
                    or invalid.
                </p>

            </div>

            <div class="footer">
                Powered by Walawwa
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
